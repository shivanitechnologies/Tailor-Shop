<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | The Gentleman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-shell">
    <aside class="auth-aside" style="background-image:url('https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1000&q=72');">
      <div class="auth-aside-content">
        <div class="eyebrow">Tailoring studio</div>
        <h1>Welcome back to the atelier.</h1>
        <p>Manage appointments, measurements, custom fits, and your personal wardrobe with ease.</p>
      </div>
    </aside>
    <main class="auth-panel">
      <div class="auth-tools">
        <button class="icon-btn" data-theme-toggle><span class="theme-icon">☾</span></button>
        <button type="button" class="direction-toggle" data-direction-toggle data-direction-state="ltr" aria-label="Switch to right-to-left text direction" aria-pressed="false"><span class="direction-label">RTL</span></button>
      </div>
      <div class="auth-card">
        <a class="brand" href="../index.html"><span class="brand-mark">T</span><span class="brand-copy"><strong>THE GENTLEMAN</strong><small>Bespoke tailoring studio</small></span></a>
        <h2>Login</h2>
        <p>Sign in to manage your tailoring account.</p>
        <form data-validate>
          <div class="field"><label for="email">Email</label><input id="email" type="email" required></div>
          <div class="field"><label for="password">Password</label><input id="password" type="password" required></div>
          <div class="auth-check"><input type="checkbox" id="remember"><label for="remember">Remember Me</label></div>
          <button class="btn auth-submit">Log In</button>
        </form>
        <div class="auth-divider">or continue with</div>
        <div class="social-row">
          <button class="social-btn">Google</button>
          <button class="social-btn">Apple</button>
        </div>
        <div class="auth-foot"><a href="forgot-password.html">Forgot Password?</a> · <a href="signup.html">Create account</a></div>
      </div>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="../js/app.js"></script>
</body>
</html>
