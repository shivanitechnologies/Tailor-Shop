<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | The Gentleman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-shell">
    <aside class="auth-aside" style="background-image:url('https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1000&q=72');"><div class="auth-aside-content"><div class="eyebrow">Support</div><h1>Reset access to your account.</h1><p>Need help getting back into your tailoring profile? We can send a secure reset link.</p></div></aside>
    <main class="auth-panel"><div class="auth-tools"><button class="icon-btn" data-theme-toggle><span class="theme-icon">☾</span></button><button type="button" class="direction-toggle" data-direction-toggle data-direction-state="ltr" aria-label="Switch to right-to-left text direction" aria-pressed="false"><span class="direction-label">RTL</span></button></div><div class="auth-card"><a class="brand" href="../index.html"><span class="brand-mark">T</span><span class="brand-copy"><strong>THE GENTLEMAN</strong><small>Bespoke tailoring studio</small></span></a><h2>Forgot password</h2><p>Enter your email and we will send a reset instructions message.</p><form data-validate> <div class="field"><label for="reset-email">Email Address</label><input id="reset-email" type="email" required></div><button class="btn auth-submit">Send Reset Link</button></form><div class="auth-foot"><a href="login.html">Back to login</a></div></div></main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="../js/app.js"></script>
</body>
</html>
